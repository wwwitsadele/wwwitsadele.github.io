<!DOCTYPE html>  
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad&eacute;le</title>
    
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />


  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, #d8b4e2, #a7d7f6, #f6d1e7);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: #fff;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      z-index: 2;
      padding: 2rem;
      backdrop-filter: blur(6px);
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(to right, #ffb6c1, #dda0dd, #87cefa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.2rem;
      margin: 0.5rem 0;
    }

    a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      background: #ffb6c1;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: 0.3s;
    }

    a:hover {
      background: #dda0dd;
    }

    /* Falling blossoms */
    .blossom {
      position: absolute;
      top: -10vh;
      pointer-events: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ Hi, I’m Ad&eacute;le ✨</h1>
    <p id="tagline"></p>
    <p>You can reach me at: <a href="mailto:adele@itsadele.com">adele@itsadele.com</a></p>
  </div>

  <script>
    const taglines = [
      "Already in bloom. This little corner of the internet is growing into something beautiful — and you arrived right on time.",
      "Like petals on the wind, every visit is a fresh start. Glad you're here.",
      "Bloom where you're planted. Right now, that's right here. Welcome.",
      "No becoming. Just being. And you're part of it.",
      "The blossoms fall, the gradient shifts, and here you are. Perfect timing.",
      "This space grows with every visit. Thanks for being part of its story.",
      "You don't need to become anything you're not already. Just showing up is enough."
    ];
    document.getElementById("tagline").textContent = taglines[Math.floor(Math.random() * taglines.length)];

    function createBlossom() {
      const blossom = document.createElement("img");
      blossom.src = "blom.png"; // put blossom.png in same folder as index.html
      blossom.classList.add("blossom");
      blossom.style.left = Math.random() * 100 + "vw";
      blossom.style.animationDuration = (5 + Math.random() * 5) + "s";
      blossom.style.width = (15 + Math.random() * 55) + "px";
      document.body.appendChild(blossom);

      setTimeout(() => {
        blossom.remove();
      }, 10000);
    }

    setInterval(createBlossom, 400);
  </script>
</body>
</html>
